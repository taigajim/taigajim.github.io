      :root {
        color-scheme: dark;
        font-family:
          system-ui,

          sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --accent: #d97077;
        --accent-hover: #ec7c83;
        --zinc-950: #09090b;
        --zinc-300: #d4d4d8;
        --zinc-500: #71717a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        background: var(--zinc-950);
        color: var(--zinc-300);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .handoff {
        display: flex;
        width: min(100%, 480px);
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .logotype {
        width: min(100%, 384px);
        height: auto;
        margin-bottom: 24px;
        color: var(--zinc-300);
      }

      h1 {
        margin: 0 0 8px;
        color: var(--zinc-300);
        font-size: 18px;
        font-weight: 600;
        line-height: 28px;
      }

      p {
        margin: 0;
        color: var(--zinc-500);
        font-size: 14px;
        line-height: 20px;
      }

      .actions {
        display: flex;
        min-height: 40px;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        display: inline-flex;
        min-height: 32px;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        background: var(--accent);
        color: white;
        font-size: 12px;
        font-weight: 500;
        padding: 6px 12px;
        text-decoration: none;
        transition: background-color 80ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      a:hover {
        background: var(--accent-hover);
      }

      a:focus-visible {
        outline: 2px solid var(--accent-hover);
        outline-offset: 3px;
      }

      .countdown {
        min-width: 112px;
        color: var(--zinc-500);
        font-size: 12px;
        line-height: 16px;
        text-align: left;
      }

      @media (max-width: 420px) {
        .actions {
          flex-direction: column;
          gap: 8px;
        }

        .countdown {
          text-align: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>

    <script>
      const destination = 'https://slipcut.com/';
      const countdown = document.getElementById('countdown');
      let seconds = 3;

      const interval = window.setInterval(() => {
        seconds -= 1;
        if (seconds > 0) {
          countdown.textContent = `Redirecting in ${seconds} second${seconds === 1 ? '' : 's'}…`;
        }
      }, 1000);

      window.setTimeout(() => {
        window.clearInterval(interval);
        window.location.replace(destination);
      }, 3000);
    </script>
