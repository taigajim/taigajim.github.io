<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>le git de taigajim</title>
    <style>
      :root {
        --COLOR_BG: #0d1117;
        --COLOR_TEXT: #c9d1d9;
        --COLOR_MUTED: #7d8590;
        --COLOR_HEAD: #f0f6fc;
        --COLOR_SUBTEXT: #8b949e;
        --COLOR_ACCENT: #58a6ff;
        --COLOR_ACCENT_HOVER: #79c0ff;
        --COLOR_CARD_BG: #161b22;
        --COLOR_CARD_BORDER: #30363d;
        --RADIUS_MD: 6px;
        --TRANSITION_FAST: 150ms ease;
      }
      body {
        font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
        background: var(--COLOR_BG);
        color: var(--COLOR_TEXT);
        margin: 0;
        padding: 40px 20px;
        line-height: 1.6;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        text-align: center;
      }
      h1 {
        color: var(--COLOR_ACCENT);
        margin-bottom: 0;
        font-size: 2.5em;
      }
      .subtitle {
        color: var(--COLOR_MUTED);
        margin-bottom: 2em;
        font-size: 1.2em;
      }
      .projects {
        margin-top: 50px;
        text-align: left;
      }
      .projects h2 {
        color: var(--COLOR_HEAD);
        border-bottom: 1px solid var(--COLOR_CARD_BORDER);
        padding-bottom: 10px;
      }
      .project {
        display: block;
        margin: 20px 0;
        padding: 16px 18px;
        background: var(--COLOR_CARD_BG);
        border-radius: var(--RADIUS_MD);
        border: 1px solid var(--COLOR_CARD_BORDER);
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: transform var(--TRANSITION_FAST), box-shadow var(--TRANSITION_FAST), border-color var(--TRANSITION_FAST), background-color var(--TRANSITION_FAST), color var(--TRANSITION_FAST);
        will-change: transform;
        position: relative;
      }
      .project:hover,
      .project:focus-visible {
        outline: none;
        transform: translateY(-2px);
        border-color: var(--COLOR_ACCENT);
        box-shadow: 0 10px 24px rgba(1, 4, 9, 0.35), 0 0 0 3px rgba(56, 139, 253, 0.25);
      }
      .project:active {
        transform: translateY(0);
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
      }
      .project-title {
        color: var(--COLOR_ACCENT);
        font-weight: 700;
        font-size: 1.05em;
      }
      .project:hover .project-title,
      .project:focus-visible .project-title {
        color: var(--COLOR_ACCENT_HOVER);
      }
      .project-desc {
        color: var(--COLOR_SUBTEXT);
        margin-top: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        .project {
          transition: box-shadow var(--TRANSITION_FAST), border-color var(--TRANSITION_FAST), background-color var(--TRANSITION_FAST), color var(--TRANSITION_FAST);
        }
        .project:hover,
        .project:focus-visible,
        .project:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>taigajim</h1>
      <p class="subtitle">whoomp there it is</p>

      <div class="projects">
        <h2>projects</h2>

        <a class="project" href="/slipcut/">
          <div class="project-title">slipcut</div>
          <div class="project-desc">browser-based audio slicer & remix tool</div>
        </a>

        <a class="project" href="https://github.com/taigajim/image-slider">
          <div class="project-title">image Slider</div>
          <div class="project-desc">stack-based image slider</div>
        </a>
      </div>
    </div>
  </body>
</html>
